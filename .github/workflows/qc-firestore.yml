name: Firestore QC audit

on:
  push:
    paths:
      - .github/workflows/qc-firestore.yml

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Add missing 15-day milestone due dates
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          PROJECT_ID = "seo-project-onboarding-tracker"
          ROOT = f"https://firestore.googleapis.com/v1/projects/{PROJECT_ID}/databases/(default)/documents"
          DHAKA = ZoneInfo("Asia/Dhaka")

          def request(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method, headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  body=r.read().decode()
                  return json.loads(body) if body else {}

          def list_docs(collection):
              return request(f"{ROOT}/{collection}?"+urllib.parse.urlencode({"pageSize":"100"})).get("documents",[])

          def field(doc,key):
              return doc.get("fields",{}).get(key,{})

          def patch_due(collection, pid, firestore_value):
              url=f"{ROOT}/{collection}/{pid}?"+urllib.parse.urlencode({"updateMask.fieldPaths":"dueDate"})
              request(url,"PATCH",{"fields":{"dueDate":firestore_value}})

          changed=[]
          for doc in list_docs("projects"):
              if field(doc,"dueDate"):
                  continue
              start=field(doc,"startDate").get("timestampValue")
              if not start:
                  continue
              instant=datetime.fromisoformat(start.replace("Z","+00:00"))
              local=instant.astimezone(DHAKA)
              due_local=datetime(local.year,local.month,local.day,tzinfo=DHAKA)+timedelta(days=14)
              due_utc=due_local.astimezone(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z")
              pid=doc["name"].split("/")[-1]
              patch_due("projects",pid,{"timestampValue":due_utc})
              changed.append(f"projects/{pid}={due_utc}")

          for doc in list_docs("dmProjects"):
              if field(doc,"dueDate"):
                  continue
              start=field(doc,"startDate").get("stringValue")
              if not start:
                  continue
              start_date=datetime.strptime(start[:10],"%Y-%m-%d").date()
              due=(start_date+timedelta(days=14)).isoformat()
              pid=doc["name"].split("/")[-1]
              patch_due("dmProjects",pid,{"stringValue":due})
              changed.append(f"dmProjects/{pid}={due}")

          print(f"MIGRATED={len(changed)}")
          for row in changed: print(row)

          missing=[]
          for collection in ("projects","dmProjects"):
              for doc in list_docs(collection):
                  if not field(doc,"dueDate"):
                      missing.append(doc["name"])
          print(f"MISSING_DUE_DATE_AFTER={len(missing)}")
          if missing:
              raise RuntimeError("Due-date migration incomplete: "+", ".join(missing))
          PY
