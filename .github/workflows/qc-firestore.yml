name: Firestore QC audit

on:
  push:
    paths:
      - .github/workflows/qc-firestore.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect legacy SEO task anomalies
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from collections import Counter

          PROJECT_ID = "seo-project-onboarding-tracker"
          ROOT = f"https://firestore.googleapis.com/v1/projects/{PROJECT_ID}/databases/(default)/documents"
          TARGETS = {
              "6MSNgXaRoV7CcAKLdj1g": "Igloo",
              "GqVV077clNQvOZnBsVJ0": "Hatil",
              "KbGU0qZT1oQKUCMVNiDc": "ABC News",
              "p6VG6rwp7OrfpuxbSrJ6": "Acme",
          }

          def list_docs(path):
              url=f"{ROOT}/{path}?"+urllib.parse.urlencode({"pageSize":"100"})
              with urllib.request.urlopen(url, timeout=30) as r:
                  return json.loads(r.read().decode()).get("documents",[])

          def value(doc,key):
              f=doc.get("fields",{}).get(key,{})
              for k in ("stringValue","integerValue","booleanValue"):
                  if k in f: return f[k]
              return None

          for pid,name in TARGETS.items():
              tasks=list_docs(f"projects/{pid}/tasks")
              rows=[]
              for t in tasks:
                  rows.append({
                      "id":t["name"].split("/")[-1],
                      "title":value(t,"title"),
                      "phase":value(t,"phase"),
                      "order":value(t,"order"),
                      "dayTarget":value(t,"dayTarget"),
                      "completed":value(t,"completed"),
                      "isCustom":value(t,"isCustom"),
                  })
              print(f"\nPROJECT {name} {pid} task_count={len(rows)}")
              for row in sorted(rows, key=lambda r: (int(r["order"] or 0), r["title"] or "")):
                  print(json.dumps(row, sort_keys=True))
              counts=Counter((r["title"],r["phase"],r["order"]) for r in rows)
              duplicates=[{"title":k[0],"phase":k[1],"order":k[2],"count":v} for k,v in counts.items() if v>1]
              print("DUPLICATES",json.dumps(duplicates,sort_keys=True))
          PY
